<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="../" />
<title>Linkey — Add pop-up QA</title>
<link rel="stylesheet" href="../assets/css/app.css" />
<style>
  html, body { height: 100%; }
  body { background: #EDEDED; display: grid; place-items: center; }
</style>
</head>
<body>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/providers.js"></script>
<script src="../assets/js/addpop.js"></script>
<script>
  window.toast = function () {};
  window.refresh = function () {};

  var q = new URLSearchParams(location.search);
  window.addEventListener("load", function () {
    AddPop.open();
    var tab = q.get("tab");
    if (tab) {
      var el = document.querySelector('[data-tab="' + tab + '"]');
      if (el) el.click();
    }
    var scroll = Number(q.get("scroll") || 0);
    if (scroll) {
      var panel = document.querySelector(".addpop__panel");
      if (panel) panel.scrollTop = scroll;
    }
    var pick = q.get("pick");
    if (pick) {
      var row = document.querySelector('[data-pick="' + pick + '"]');
      if (row) row.click();
    }
    var url = q.get("url");
    if (url) {
      var field = document.querySelector("#addpop-url");
      if (field) { field.value = url; field.dispatchEvent(new Event("input", { bubbles: true })); }
    }
  });
</script>
</body>
</html>
